# Builds the single-container image and publishes it to GitHub Container
# Registry (ghcr.io/wess/stohr) and Docker Hub (docker.io/wess/stohr).
#
# Triggers:
#   - push to main      -> tags: main, sha-<short>
#   - push of a v* tag  -> tags: <x.y.z>, <x.y>, latest, sha-<short>
#   - manual dispatch
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  -- Docker Hub account name (wess)
#   DOCKERHUB_TOKEN     -- Docker Hub access token with Read & Write scope
# GHCR auth uses the built-in GITHUB_TOKEN; no secret needed.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required by actions/attest-build-provenance to mint the OIDC token
  # that signs the attestation. Without it the attest step 403s.
  id-token: write
  attestations: write

# A second push to the same ref shouldn't race the first. We don't
# cancel-in-progress: a tag publish must always finish, even if a
# follow-up main push lands while it's building.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # libs/atlas is a git submodule the Dockerfile COPYs into the build
      # context — bun install resolves @atlas/* from libs/atlas/packages/*.
      # Without submodules:recursive the image build fails.
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          # latest only follows release tags, not every main push.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # mode=max records every build step in the provenance, not just
          # the final layer. Slightly larger but worth it for auditability.
          provenance: mode=max
          sbom: true

      # GitHub-native build provenance, separate from the in-image
      # provenance baked in by buildx above. One attestation per registry
      # since the image lives at two refs (same digest in both).
      - name: Attest GHCR image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Mirrors README.md to the Docker Hub repo page. Non-fatal: a
      # description sync failure must not fail an otherwise-good publish.
      - name: Sync Docker Hub description
        if: github.event_name == 'push'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          readme-filepath: ./README.md
          short-description: "Self-hostable cloud storage — Bun + React + Postgres + S3."
