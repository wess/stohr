<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stohr WebDAV — mount your self-hosted cloud as a network drive from macOS Finder, Windows Explorer, GNOME Files, or rclone. RFC 4918 compliant.">
  <title>Stohr — WebDAV</title>
  <script>
    (function(){
      var t = localStorage.getItem('stohr_theme');
      var dark = t === 'dark' || ((t !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <!-- STATIC_LINKS -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./pages/mount.tsx"></script>
</body>
</html>
