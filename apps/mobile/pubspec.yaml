name: stohrapp
description: Stohr cloud storage
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  cached_network_image: ^4.0.6
  url_launcher: ^6.3.3
  http: ^1.6.0
  stohr:
    path: ../../sdks/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
