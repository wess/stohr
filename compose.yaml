services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stohr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stohr"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: bun src/server.ts
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/stohr
      SECRET: ${SECRET}
      # Connection pool. Keep DB_POOL * (api replicas) under the Postgres
      # server's max_connections (100 by default on the postgres:16 image).
      DB_POOL: ${DB_POOL:-20}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      # Used when STORAGE_DRIVER=local. The named `blobs` volume below is
      # mounted at /data/blobs unconditionally — empty / unused if you stay
      # on the s3 driver. Override STORAGE_LOCAL_DIR if you bind-mount a
      # different path.
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/blobs}
      # Used when STORAGE_DRIVER=s3.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3001}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Stohr <onboarding@resend.dev>}
      RP_ID: ${RP_ID:-localhost}
      RP_NAME: ${RP_NAME:-Stohr}
      RP_ORIGIN: ${RP_ORIGIN:-http://localhost:3001}
      # Trust X-Forwarded-For only when the request enters from the docker
      # bridge — i.e. from the `web` service. Anything outside this range
      # cannot pin or spoof rate-limit buckets. Compose default networks live
      # in 172.16.0.0/12.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # RAM ceiling per concurrent upload. With STORAGE_DRIVER=s3, Bun and
      # SigV4 hashing both buffer; with STORAGE_DRIVER=local the buffer
      # only lives until it lands on disk.
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      # Optional ClamAV malware scanning. Uncomment + enable the `clamav`
      # service below to gate downloads of infected uploads. Leave CLAMD_HOST
      # blank to disable scanning entirely (uploads are marked 'skipped').
      CLAMD_HOST: ${CLAMD_HOST:-}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      # OIDC single sign-on. All three are required together; leave them unset
      # and Stohr runs with local auth only. Without these passed through, the
      # SSO button can't be enabled from a compose deployment at all.
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      # Machine-to-machine user provisioning. Blank keeps /castle/* unmounted.
      CASTLE_ADMIN_TOKEN: ${CASTLE_ADMIN_TOKEN:-}
      # Social sign-in (each provider needs both halves to activate).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SOCIAL_AUTO_PROVISION: ${SOCIAL_AUTO_PROVISION:-true}
    volumes:
      - blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bun src/web/serve.ts
    environment:
      WEB_PORT: "3001"
      API_URL: http://api:3000
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-120}
    depends_on:
      - api
    restart: unless-stopped

  # Optional ClamAV sidecar for malware scanning. To enable:
  #   1. Uncomment this whole service.
  #   2. Set CLAMD_HOST=clamav in your .env (CLAMD_PORT defaults to 3310).
  #   3. Add `clamav` under the api service's `depends_on`.
  # Privacy note: clamd runs locally; no file bytes ever leave the host.
  # clamav:
  #   image: clamav/clamav:latest
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "echo PING | nc -w 5 localhost 3310 | grep -q PONG"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 120s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
  caddyconfig:
  blobs:
